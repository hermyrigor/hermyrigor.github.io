<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Hermy Rigor</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121212">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main class="notfound">
    <div class="container text-center">
      <p class="mono text-muted-c mb-2">error / not found</p>
      <h1 class="font-display display-name">404</h1>
      <p class="lead text-muted-c mb-4">This page doesn’t exist, or it has moved.</p>
      <a href="/" class="btn btn-emph">Back to the portfolio</a>
    </div>
  </main>
</body>
</html>
