<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermy Rigor | Aspiring Web Developer</title>
  <meta name="description" content="Portfolio of Hermy Rigor, BS Information Technology graduate from San Mateo, Isabela, open to web development, IT support, and IT staff roles.">
  <meta name="theme-color" content="#121212">

  <!-- Set the theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {}
    })();
  </script>

  <!-- Fonts: Doto (name and headings), Inter (body), JetBrains Mono (small labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 and Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Our styles load last so they override Bootstrap -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

          <i class="bi bi-sun-fill icon-light" aria-hidden="true"></i>
        </button>

        <h1 class="font-display display-name">Hermy Rigor</h1>
        <p class="lead text-muted-c">Aspiring Web Developer</p>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
